name: Validate static app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/catalog.json','utf8')); JSON.parse(require('fs').readFileSync('data/taxonomy.json','utf8')); JSON.parse(require('fs').readFileSync('my-hub.json','utf8')); console.log('JSON OK')"
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f manual.html
          test -f data/catalog.json
          test -f docs/REQUIREMENTS.md
